<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<title>Nasze podróże</title>

<style>
.h1 {
  background-color: rgb(142, 190, 233);
  width: auto;
  height: 75px;
  border-radius: 5px;
  text-align: center;
  margin: 5px 10px;
  padding: 15px 0;
}

#amfi {
  width: auto;
  height: 75px;
  border-radius: 5px;
  cursor: pointer;
  transition: 0.3s;
}

#amfi:hover {
  height: 80px;
  border-radius: 15px;
}

body {
  background-color: #FFC87C;
}

.list {
  background-color: rgb(142, 190, 233);
  width: auto;
  height: auto;
  border-radius: 10px;
  margin: 5px 10px;
  padding: 15px 0;
}

.wroc {
  width: 100px;
  border-radius: 5px;
  background-color: rgb(142, 190, 233);
  scale: 1.5;
  text-align: center;
  margin: 25px;
  cursor: pointer;
}

.name {
  width: 320px;
  padding: 1px 25px;
}

/* LIGHTBOX */
#lightbox {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.85);
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

#lightbox img {
  max-width: 90%;
  max-height: 90%;
  border-radius: 10px;
}
</style>
</head>

<body>

<h1 class="h1">Nasze podróże/chorwacja/Nin</h1>

<div class="list">
  <h3 class="name">Nin</h3>

  <ul>
    <li>
      <p>piaszczysta laguna:</p>

      <img src="z3.jpg" id="amfi">
      <img src="z3.jpg" id="amfi">
      <img src="z3.jpg" id="amfi">
      <img src="z3.jpg" id="amfi">
      <img src="z3.jpg" id="amfi">
      <img src="z3.jpg" id="amfi">
    </li>

    <li>soon</li>

    <li>
      <p>inne zdjęcia z podróży:</p>

      <img src="z8.jpg" id="amfi">

      <div></div>

      <img src="z3.jpg" id="amfi">
      <img src="z3.jpg" id="amfi">
      <img src="z3.jpg" id="amfi">

      <div></div>

      <img src="z3.jpg" id="amfi">
      <img src="z3.jpg" id="amfi">
    </li>
  </ul>
</div>

<div onclick="history.back()" class="wroc">Wróć</div>

<!-- LIGHTBOX -->
<div id="lightbox">
  <img>
</div>

<script>
const images = document.querySelectorAll("#amfi");
const lightbox = document.getElementById("lightbox");
const lightboxImg = lightbox.querySelector("img");

images.forEach(img => {
  img.addEventListener("click", () => {
    lightbox.style.display = "flex";
    lightboxImg.src = img.src;
  });
});

lightbox.addEventListener("click", () => {
  lightbox.style.display = "none";
});
</script>

</body>
</html>
