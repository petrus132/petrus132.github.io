<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <title>Moja pierwsza strona</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #020617;
      padding: 32px 40px;
      border-radius: 18px;
      box-shadow: 0 18px 45px rgba(15,23,42,0.9);
      border: 1px solid #1f2937;
      max-width: 480px;
    }
    h1 {
      margin-top: 0;
      font-size: 28px;
      margin-bottom: 8px;
    }
    p {
      margin: 0 0 12px;
      line-height: 1.5;
    }
    .tag {
      display: inline-block;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #38bdf8;
      margin-bottom: 12px;
    }
    .btn {
      display: inline-block;
      margin-top: 12px;
      padding: 10px 18px;
      border-radius: 999px;
      background: #38bdf8;
      color: #020617;
      font-weight: 600;
      text-decoration: none;
      font-size: 14px;
    }
    .btn:hover {
      background: #0ea5e9;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="tag">learning in progress</div>
    <h1>Cześć, to moja pierwsza strona 🚀</h1>
    <p>Uczę się HTML, CSS i JavaScript i właśnie wrzuciłem swoją stronę na GitHub Pages.</p>
    <p>To dopiero początek, ale będzie tu coraz więcej fajnych rzeczy.</p>
    <a class="btn" href="#">Wracam do kodzenia</a>
  </div>
</body>
</html>
